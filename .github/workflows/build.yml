name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          # Proje zip olarak durduysa aç
          if [ -f mod-project.zip ]; then
            unzip -o mod-project.zip -d mod-project
          fi

          # build.gradle dosyasının bulunduğu klasörü bul
          BUILD_FILE=$(find . -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts \) -not -path './.git/*' | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle bulunamadı"
            exit 1
          fi
          cd "$(dirname "$BUILD_FILE")"
          echo "Build klasörü: $(pwd)"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --stacktrace
          else
            gradle build --stacktrace
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: '**/build/libs/*.jar'
          
